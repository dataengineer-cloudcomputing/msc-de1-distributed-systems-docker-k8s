services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-sample-app:1.0.0
    container_name: flask-app
    ports:
      - "8080:5000"
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
